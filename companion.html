<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Companion Builder</title>
<meta name="description" content="KLEEM – Stream-Deck-Grundbelegungen für Bitfocus Companion erzeugen, offline">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Companion">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  --bg: #0e1116;
  --panel: #161b22;
  --panel2: #1d232c;
  --line: #2a313c;
  --text: #e6e9ee;
  --muted: #8b95a5;
  --accent: #ff7a1a;
  --accent2: #ffb366;
  --ok: #2fbf71;
  --warn: #f2c94c;
  --err: #eb5757;
  --radius: 10px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: dark;
}
:root[data-theme='light'] {
  --bg: #f3f4f6;
  --panel: #ffffff;
  --panel2: #f7f8fa;
  --line: #d9dde3;
  --text: #15191f;
  --muted: #5f6977;
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme='dark']) {
    --bg: #f3f4f6;
    --panel: #ffffff;
    --panel2: #f7f8fa;
    --line: #d9dde3;
    --text: #15191f;
    --muted: #5f6977;
    color-scheme: light;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); -webkit-text-size-adjust: 100%; }
body { padding-bottom: env(safe-area-inset-bottom); }
button, input, select, textarea { font: inherit; color: inherit; }
h2 { font-size: 1.15rem; margin: 0 0 .75rem; }
h3 { font-size: 1rem; margin: 0; }
small, .muted { color: var(--muted); }
code { font-family: var(--mono); font-size: .85em; }

/* Kopf */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand small { display: block; font-size: .75rem; }
.logo { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: #111; display: grid; place-items: center; font-weight: 800; flex: none; }
.applinks { display: flex; gap: 6px; margin-left: auto; }
.applinks a { color: var(--accent2); text-decoration: none; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: .9rem; white-space: nowrap; }
.project { display: flex; gap: 6px; align-items: center; min-width: 0; }
.project select { max-width: 220px; }

.tabs { display: flex; gap: 4px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; position: sticky; top: 57px; z-index: 4; }
.tabs button { background: none; border: 0; padding: 8px 14px; border-radius: 8px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tabs button.active { background: var(--panel2); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
.tabs .icon { margin-left: auto; }

main { padding: 16px; max-width: 1400px; margin: 0 auto; }
.tab { display: none; }
.tab.active { display: block; }

/* Bausteine */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.card-head { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; margin-bottom: 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px 12px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--muted); }
label.f.check { flex-direction: row; align-items: center; gap: 8px; color: var(--text); font-size: .9rem; }
input, select, textarea { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 38px; width: 100%; }
input[type='checkbox'] { width: 20px; height: 20px; min-height: 0; accent-color: var(--accent); }
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
button.btn, .btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; min-height: 38px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600; }
.btn.danger { color: var(--err); }
.btn:disabled { opacity: .5; cursor: default; }
button.ghost { background: none; border: 1px solid var(--line); border-radius: 8px; min-width: 38px; min-height: 38px; cursor: pointer; }
.pill { display: inline-block; font-size: .72rem; padding: 2px 8px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); }
.pill.kp { border-color: var(--accent); color: var(--accent2); }
.empty { text-align: center; padding: 30px 10px; color: var(--muted); }
.hint { font-size: .85rem; color: var(--muted); margin: 6px 0 0; }
.warn { color: var(--warn); }
.list-actions { display: flex; gap: 6px; }

.add-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }

.page-row { display: grid; grid-template-columns: 28px minmax(140px, 1fr) minmax(140px, 1.2fr) minmax(180px, 2fr) auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.page-row .num { color: var(--muted); font-variant-numeric: tabular-nums; }
.cams { display: flex; flex-wrap: wrap; gap: 6px 12px; }
.cams label { display: flex; gap: 6px; align-items: center; font-size: .85rem; }

/* Vorschau */
.preview-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.deck { background: #050608; border-radius: 18px; padding: 16px; font-size: 11px; display: inline-grid; gap: 8px; border: 1px solid #222; max-width: 100%; overflow-x: auto; }
.cell { width: var(--k, 72px); height: var(--k, 72px); border-radius: 9px; border: 1px solid #000; display: flex; align-items: center; justify-content: center; text-align: center; font-size: inherit; line-height: 1.15; color: #fff; padding: 4px; white-space: pre-line; overflow: hidden; cursor: pointer; position: relative; word-break: break-word; }
.cell.empty { background: #15181d; border: 1px dashed #2b2f36; cursor: default; }
.cell.sel { outline: 3px solid var(--accent); outline-offset: 1px; }
.cell .fb { position: absolute; top: 3px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.cell.lcd { width: auto; border-radius: 4px; height: calc(var(--k, 72px) * .8); background: #0b0f14; }
.cell.enc { border-radius: 50%; background: radial-gradient(circle at 40% 35%, #555, #1a1a1a 70%); border: 2px solid #333; }
.cell.enc span { font-size: 10px; }
.cell.nav { background: #303030; }
.cell.ring { box-shadow: 0 0 0 3px #2a6; }
.deck-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.deck-tabs button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.deck-tabs button.active { border-color: var(--accent); color: var(--accent2); }
.detail { position: sticky; top: 120px; }
.detail pre { background: var(--panel2); border-radius: 8px; padding: 8px; font: 12px/1.4 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 50vh; overflow: auto; margin: 6px 0; }
.detail h4 { margin: 12px 0 2px; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.report { font-size: .85rem; }
.report li { margin: 2px 0; }

dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(560px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0, 0, 0, .55); }
dialog form { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.dlg-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.kp-list { max-height: 50vh; overflow: auto; display: flex; flex-direction: column; gap: 4px; }
.kp-list label { display: flex; gap: 8px; align-items: center; padding: 6px; border-radius: 6px; background: var(--panel2); }

#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; opacity: 0; transition: .25s; pointer-events: none; z-index: 20; max-width: calc(100vw - 32px); }
#toast.show { opacity: 1; transform: translateX(-50%); }

@media (max-width: 900px) {
  .preview-wrap { grid-template-columns: 1fr; }
  .detail { position: static; }
  .page-row { grid-template-columns: 24px 1fr; }
  .page-row > :nth-child(n + 3) { grid-column: 2; }
}
@media (max-width: 560px) {
  .applinks a { padding: 6px 8px; font-size: .8rem; }
  .brand small { display: none; }
  .project select { max-width: 140px; }
  main { padding: 12px 16px; }
}

</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">K</span><div><strong>Companion Builder</strong><small>KLEEM · Stream Deck → Companion 5.1 (ab 4.3)</small></div></div>
  <nav class="applinks"><a href="index.html">Kabelplan</a><a href="lager.html">Lager</a></nav>
  <div class="project">
    <select id="projectSelect" aria-label="Projekt"></select>
    <button id="projectNew" class="ghost" title="Neues Projekt">＋</button>
    <button id="projectMenu" class="ghost" title="Projekt-Aktionen">⋯</button>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button data-tab="devices" class="active">Geräte</button>
  <button data-tab="decks">Stream Decks</button>
  <button data-tab="preview">Vorschau</button>
  <button data-tab="export">Export</button>
  <button data-tab="settings" class="icon" title="Einstellungen">⚙</button>
</nav>

<main>
  <section id="tab-devices" class="tab active"></section>
  <section id="tab-decks" class="tab"></section>
  <section id="tab-preview" class="tab"></section>
  <section id="tab-export" class="tab"></section>
  <section id="tab-settings" class="tab"></section>
</main>

<dialog id="dlg"><form method="dialog" id="dlgBody"></form></dialog>
<div id="toast" role="status"></div>

        <div class="deck" style="--k:${k}px;font-size:${k < 50 ? 8 : 11}px;grid-template-columns:repeat(${deck.cols}, var(--k))">${gridHtml}</div>
        ${pg ? reportHtml(pg, deck) : ""}
      </div>
      <div class="card detail">${sel ? detailHtml(sel) : '<p class="muted">Taste, LCD-Feld oder Drehregler antippen, um Aktionen und Rückmeldungen zu sehen.</p><p class="hint">Grüner Punkt = Taste hat Feedback (Rückmeldung vom Gerät). ‹name› = wird live aus der Companion-Variable gefüllt.</p>'}</div>
    </div>`;
    el.querySelectorAll("[data-deck]").forEach((b) => b.onclick = () => (ui.previewDeck = Number(b.dataset.deck), ui.previewPage = 0, ui.selCell = null, renderPreview()));
    el.querySelectorAll("[data-pg]").forEach((b) => b.onclick = () => (ui.previewPage = Number(b.dataset.pg), ui.selCell = null, renderPreview()));
    el.querySelectorAll("[data-cell]").forEach((c) => c.onclick = () => (ui.selCell = c.dataset.cell, renderPreview()));
    el.querySelectorAll("[data-pref]").forEach((b) => b.onclick = () => {
      const pc = pageCfg(b.dataset.pid);
      if (!pc) return;
      pc.keyPrefs = pc.keyPrefs || {};
      if (b.dataset.val) pc.keyPrefs[b.dataset.pref] = b.dataset.val;
      else delete pc.keyPrefs[b.dataset.pref];
      save();
      renderPreview();
    });
    el.querySelectorAll("[data-listenc]").forEach((cb) => cb.onchange = () => {
      const pc = pageCfg(cb.dataset.listenc);
      if (pc) (pc.listEncoder = cb.checked, save(), renderPreview());
    });
    el.querySelectorAll("[data-prefreset]").forEach((b) => b.onclick = () => {
      const pc = pageCfg(b.dataset.prefreset);
      if (pc) (pc.keyPrefs = {}, save(), renderPreview());
    });
  }
  function pageCfg(id) {
    for (const d of P().decks) for (const pg of d.pages) if (pg.id === id) return pg;
    return null;
  }
  function reportHtml(pg, deck) {
    const r = pg.report;
    const li = [];
    if (r.warning) li.push(`<li class="warn">${esc(r.warning)}</li>`);
    const pgCfg = pageCfg(pg.pageId);
    const prefs = pgCfg?.keyPrefs || {};
    const chip = (x, act, label) => `<button class="btn" style="padding:2px 8px;font-size:12px" data-pref="${esc(itemKey(x))}" data-val="${act}" data-pid="${pg.pageId}">${label}</button>`;
    if (r.onEncoder?.length) li.push(`<li><b>Auf dem Drehregler zum Blättern</b> (drehen = auswählen, drücken = auslösen):<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${r.onEncoder.map((x) => `<span class="pill" style="display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line,#444);border-radius:8px;padding:3px 6px">${esc(plainLabel(x.btn))} ${chip(x, "show", "als Taste")}${prefs[itemKey(x)] === "hide" ? chip(x, "", "zurück") : ""}</span>`).join("")}</div></li>`);
    if (r.dropped.length) li.push(`<li class="warn">Kein Platz für: <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${r.dropped.map((x) => `<span style="display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line,#444);border-radius:8px;padding:3px 6px">${esc(plainLabel(x.btn))} ${chip(x, "show", "statt einer anderen Taste zeigen")}</span>`).join("")}</div>${deck.encoders.length ? "" : "<small>Dieses Deck hat keine Drehregler – eine weitere Seite oder ein größeres Deck schafft Platz.</small>"}</li>`);
    if (pgCfg && deck.encoders.length) li.push(`<li><label class="f check" style="margin:0"><input type="checkbox" data-listenc="${pg.pageId}" ${pgCfg.listEncoder !== false ? "checked" : ""}> Tasten ohne Platz automatisch auf einen freien Drehregler legen</label></li>`);
    if (Object.keys(prefs).length) li.push(`<li><button class="btn" style="padding:2px 8px;font-size:12px" data-prefreset="${pg.pageId}">Meine Platzierungen für diese Seite zurücksetzen</button></li>`);
    if (r.droppedEncoders.length && deck.encoders.length) li.push(`<li class="warn">Regler ohne Platz: ${esc(r.droppedEncoders.map((e) => e.name || displayText(e).split("\n")[0]).join(", "))}</li>`);
    if (r.droppedEncoders.length && !deck.encoders.length) li.push(`<li>Dieses Deck hat keine Drehregler – Regler-Funktionen ${P().encodersAsKeys ? "wurden (wo sinnvoll) als −/+ Tasten angelegt" : "entfallen"}.</li>`);
    return li.length ? `<ul class="report">${li.join("")}</ul>` : "";
  }
  function describeEntity(e, devLabels, depth = 0) {
    const pad = "  ".repeat(depth);
    const conn = e.connectionId === "internal" ? "internal" : devLabels[e.connectionId] || e.connectionId;
    const opts = Object.entries(e.options || {}).map(([k, v2]) => `${k}=${v2?.isExpression ? "{" + v2.value + "}" : JSON.stringify(v2?.value)}`).join(", ");
    let s = `${pad}${conn}: ${e.definitionId}${opts ? " (" + opts + ")" : ""}
`;
    for (const [g, ch] of Object.entries(e.children || {})) if (ch?.length) s += `${pad}  └ ${g}:
` + ch.map((c) => describeEntity(c, devLabels, depth + 2)).join("");
    return s;
  }
  function detailHtml(meta) {
    const devLabels = Object.fromEntries(P().devices.map((d) => [d.id, cleanLabel(d.label)]));
    const list = (arr) => arr && arr.length ? `<pre>${esc(arr.map((e) => describeEntity(e, devLabels)).join(""))}</pre>` : "<pre>–</pre>";
    const kindName = { key: "Taste", lcd: "LCD-Feld (Touch)", encoder: "Drehregler", nav: "Navigation" }[meta.kind] || meta.kind;
    const pg = ui._pg;
    const hasEnc = pg && DECKS[P().decks[pg.deckIdx].deckType].encoders.length;
    const prefBtns = meta.kind === "key" && meta.itemKey && pg ? `<div class="row" style="gap:6px;margin:6px 0">${hasEnc ? `<button class="btn" data-pref="${esc(meta.itemKey)}" data-val="hide" data-pid="${pg.pageId}">Auf Blätter-Regler legen</button>` : ""}${meta.pref ? `<button class="btn" data-pref="${esc(meta.itemKey)}" data-val="" data-pid="${pg.pageId}">Automatisch platzieren</button>` : ""}${meta.pref !== "show" ? `<button class="btn" data-pref="${esc(meta.itemKey)}" data-val="show" data-pid="${pg.pageId}">Immer als Taste zeigen</button>` : ""}</div>` : "";
    const listInfo = meta.isList ? `<p class="hint"><b>Blätter-Regler:</b> ${esc((meta.listItems || []).join(" · "))}</p>` : "";
    return `<h3>${esc(kindName)}</h3>${prefBtns}${listInfo}
    ${meta.info ? `<p class="hint">${esc(meta.info)}</p>` : ""}
    <h4>Text</h4><pre>${esc(String(meta.text).replace(/\\n/g, "\n"))}${meta.textExpression ? "\n(Expression)" : ""}</pre>
    ${meta.kind === "encoder" ? `<h4>Links drehen</h4>${list(meta.left)}<h4>Rechts drehen</h4>${list(meta.right)}<h4>Drücken</h4>${list(meta.down)}` : `<h4>Drücken</h4>${list(meta.down)}${meta.up?.length ? `<h4>Loslassen</h4>${list(meta.up)}` : ""}`}
    <h4>Rückmeldungen (Feedbacks)</h4>${list(meta.feedbacks)}`;
  }
  function renderExport() {
    const el = $("#tab-export");
    const p = P();
    const built = safeBuild();
    const pages = built ? built.pages : [];
    const used = built ? [...built.used].map((id) => built.devById[id]) : [];
    el.innerHTML = `
    <div class="card">
      <h2>Komplette Konfiguration</h2>
      <p>Alle ${pages.length} Seiten, ${used.length} Verbindung(en)${p.decks.some((d) => d.pages.some((x) => x.template === "ptz")) ? " und die PTZ-Custom-Variables" : ""} in einer Datei.</p>
      <div class="row" style="align-items:end">
        <label class="f" style="flex:1;min-width:200px">Dateiname<input id="expName" value="${esc(p.exportName || p.name)}" autocapitalize="off" spellcheck="false"></label>
        <button class="btn primary" id="expFull" ${pages.length ? "" : "disabled"}>⬇ <span id="expFn">${esc(cleanLabel(p.exportName || p.name))}</span>.companionconfig</button>
      </div>
      <p class="hint" style="border-left:3px solid #f0a43a;padding-left:8px">Ziel: <b>Companion 5.1</b> (mindestens 4.3). Ältere Companion-Versionen lesen die Datei falsch ein, ohne Fehlermeldung.</p>
      <p class="hint">Am iPad öffnet sich das Teilen-Menü: „In Dateien sichern“ wählen. Die Datei endet auf <b>.companionconfig</b> – ist sie in Companion trotzdem ausgegraut, in der Dateien-App den Namen prüfen (kein „.json“ am Ende).</p>
      <p class="hint">In Companion: <b>Import / Export → Import</b> → Datei wählen → „Full Import“. Bei <b>Buttons</b> und <b>Custom Variables</b> „Reset and Import“ wählen, <b>Connections</b> auf „Unchanged“ lassen, damit bestehende Verbindungen mit gleichem Namen weiterverwendet werden. Achtung: Reset ersetzt alle Tasten der Companion-Installation.</p>
    </div>
    <div class="card">
      <h2>Einzelne Seiten</h2>
      <p class="hint">Zum Einfügen in eine bestehende Companion-Konfiguration: Datei importieren und die Zielseite wählen. Verbindungen werden über den Namen zugeordnet oder neu angelegt.</p>
      ${pages.map((x) => `<div class="row" style="margin:6px 0"><button class="btn" data-page="${x.number}">⬇ Seite ${x.number} – ${esc(x.title)}</button><small class="muted">${esc(p.decks[x.deckIdx].name || DECKS[p.decks[x.deckIdx].deckType].name)}</small></div>`).join("") || '<p class="muted">Keine Seiten.</p>'}
    </div>
    <div class="card">
      <h2>Optionen</h2>
      <label class="f check"><input type="checkbox" id="optEnc" ${p.encodersAsKeys !== false ? "checked" : ""}> Drehregler-Funktionen auf Decks ohne Regler als −/+ Tasten anlegen</label>
      <label class="f check"><input type="checkbox" id="optPin" ${p.pinModuleVersions ? "checked" : ""}> Modulversion festschreiben (sonst: neueste installierte Version)</label>
      <h3 style="margin-top:12px">Benötigte Companion-Module</h3>
      <ul>${[...new Set(used.map((d) => d.type))].map((t) => `<li><code>${DEVICE_TYPES[t].moduleId}</code> – geprüft mit v${DEVICE_TYPES[t].moduleVersion}</li>`).join("") || '<li class="muted">–</li>'}</ul>
      <p class="hint"><b>Nur für aktuelles Companion:</b> geprüft für Companion 5.1 (Oktober 2026), funktioniert ab 4.3. Ältere Versionen (3.x, 4.0–4.2) importieren die Datei <b>ohne Fehlermeldung, aber falsch</b> – Tasten fehlen oder sind leer. Version steht in Companion links unten; Update gratis unter bitfocus.io. Module: in Companion unter Connections die jeweils aktuelle Version installieren (geprüft mit den oben genannten).</p>
    </div>`;
    const fn = () => cleanLabel(p.exportName || p.name);
    $("#expName").oninput = (e) => (p.exportName = e.target.value.trim(), save(), $("#expFn").textContent = fn());
    $("#expFull")?.addEventListener("click", () => download(`${fn()}.companionconfig`, exportFull(p)));
    el.querySelectorAll("[data-page]").forEach((b) => b.onclick = () => download(`${fn()}_seite${b.dataset.page}.companionconfig`, exportSinglePage(p, Number(b.dataset.page))));
    $("#optEnc").onchange = (e) => (p.encodersAsKeys = e.target.checked, save(), renderExport());
    $("#optPin").onchange = (e) => (p.pinModuleVersions = e.target.checked, save());
  }
  function renderSettings() {
    const el = $("#tab-settings");
    el.innerHTML = `
    <div class="card">
      <h2>Kabelplan-Kopplung</h2>
      <label class="f check"><input type="checkbox" id="setKp" ${settings.kabelplan ? "checked" : ""}> Mit dem Kabelplan-Tool zusammenarbeiten</label>
      <p class="hint">Eingeschaltet: Im Reiter „Geräte“ erscheint „Aus Kabelplan übernehmen“. Der Builder liest die Schnittstelle des Kabelplans (ab Version 2.2, <code>${BRIDGE_KEY}</code>) – automatisch funktioniert das, wenn beide unter <code>klaus-kleem.github.io</code> im selben Browser laufen (z. B. beide als Tab in Safari oder Chrome). Am iPad hat jede Home-Bildschirm-App ihren eigenen Speicher – dort im Kabelplan unter Pläne → „Für Companion exportieren“ kopieren und hier „Aus Zwischenablage einfügen“, oder die Datei laden.</p>
      <p class="hint">${readBridge() ? `✓ Kabelplan-Daten gefunden: ${readBridge().plans.length} Plan/Pläne` : "Noch keine Kabelplan-Daten in diesem Browser gefunden."}</p>
    </div>
    <div class="card">
      <h2>Darstellung</h2>
      <label class="f" style="max-width:220px">Farbschema<select id="setTheme">
        ${[["auto", "System"], ["dark", "Dunkel"], ["light", "Hell"]].map(([k, n]) => `<option value="${k}" ${settings.theme === k ? "selected" : ""}>${n}</option>`).join("")}
      </select></label>
    </div>
    <div class="card">
      <h2>Über</h2>
      <p>Companion Builder v${VERSION} · läuft komplett offline (Service Worker). Daten bleiben im Browser dieses Geräts.</p>
      <button class="btn" id="setUpdate">Nach Update suchen</button>
    </div>`;
    $("#setKp").onchange = (e) => {
      settings.kabelplan = e.target.checked;
      store.set(LS_SETTINGS, settings);
      if (settings.kabelplan) publishDevices(P());
      toast(settings.kabelplan ? "Kabelplan-Kopplung aktiv" : "Kabelplan-Kopplung aus");
    };
    $("#setTheme").onchange = (e) => {
      settings.theme = e.target.value;
      store.set(LS_SETTINGS, settings);
      render();
    };
    $("#setUpdate").onclick = async () => {
      const reg = await navigator.serviceWorker?.getRegistration();
      if (!reg) return toast("Kein Service Worker aktiv");
      await reg.update();
      toast("Geprüft – neue Version wird beim nächsten Start geladen");
    };
  }
  if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {
  });
  render();
  window.addEventListener("resize", () => ui.tab === "preview" && renderPreview());
})();
</script>
</body>
</html>
